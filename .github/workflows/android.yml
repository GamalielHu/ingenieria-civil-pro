name: Compilar APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Pruebas unitarias
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Compilar APK debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: IngenieriaCivilPro-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Renombrar APK
        if: github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/debug/app-debug.apk IngenieriaCivilPro.apk

      - name: Publicar Release con descarga directa
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ingeniería Civil Pro v1.0.${{ github.run_number }}
          body: "APK compilado automáticamente desde ${{ github.sha }}. Descarga directa: IngenieriaCivilPro.apk"
          files: IngenieriaCivilPro.apk
          make_latest: true
